name: Eval publish

# A merge made with GITHUB_TOKEN does not start workflows that listen to push.
# This workflow listens to pull_request closed so a merged PR still publishes.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  checks: read

jobs:
  eval:
    name: eval
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require the CI check job on the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          conclusions=$(gh api --paginate "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs" \
            --jq '.check_runs[] | select(.name=="check") | .conclusion')
          echo "check conclusions: ${conclusions:-none}"
          found=0
          bad=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            found=1
            if [ "$line" != "success" ]; then
              bad=1
            fi
          done <<< "$conclusions"
          if [ "$found" -ne 1 ] || [ "$bad" -ne 0 ]; then
            echo "Refusing to publish. CI job check must have succeeded on ${HEAD_SHA}."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install
      - run: npm run build --workspace=@vizzy/core --workspace=@vizzy/eval
      - run: node apps/eval/dist/cli.js run --publish
        env:
          CONVEX_URL: ${{ secrets.CONVEX_PROD_URL }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.CONVEX_PROD_URL }}
          COMPOSE_SERVER_SECRET: ${{ secrets.COMPOSE_SERVER_SECRET_PROD }}
