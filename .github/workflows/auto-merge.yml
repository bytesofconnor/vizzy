name: Auto-merge

# pull_request only. Never pull_request_target.
# Every pull request from this repository squash-merges after required checks.
# That includes majors, GitHub Actions bumps, and edits under .github,
# .cursor/rules, or AGENTS.md. A fork waits. A draft waits until it is ready.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  automerge:
    name: automerge
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false && github.event.pull_request.draft == false
    steps:
      - name: Squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
