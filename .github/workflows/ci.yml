name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm test --workspace=@vizzy/core --workspace=@vizzy/react --workspace=@vizzy/mcp --workspace=@vizzy/eval --if-present

  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
        working-directory: apps/share
      - run: npx playwright test e2e/home.spec.ts e2e/a11y.spec.ts
        working-directory: apps/share
        env:
          CI: true
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3456

  eval:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build --workspace=@vizzy/core --workspace=@vizzy/eval
      - run: node apps/eval/dist/cli.js run --publish
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          COMPOSE_SERVER_SECRET: ${{ secrets.COMPOSE_SERVER_SECRET }}

  e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
        working-directory: apps/share
      - run: npm run test:e2e --workspace=@vizzy/share
        env:
          CI: true
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3456
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          COMPOSE_SERVER_SECRET: ${{ secrets.COMPOSE_SERVER_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
