name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prove PR body check rejects a missing section
        run: |
          set -euo pipefail
          if .github/scripts/pr-body-check.sh <<'BODY'
          ## Summary
          x
          ## Verification
          x
          BODY
          then
            echo "PR body check accepted a body without Blast Radius." >&2
            exit 1
          fi

      - name: Prove PR body check accepts the three sections
        run: |
          set -euo pipefail
          .github/scripts/pr-body-check.sh <<'BODY'
          ## Summary
          x
          ## Verification
          x
          ## Blast Radius
          x
          BODY

      - name: Check this PR body
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" | .github/scripts/pr-body-check.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx turbo run build --filter=@vizzy/core --filter=@vizzy/resolve --filter=@vizzy/react
      - run: npm test --workspace=@vizzy/core --workspace=@vizzy/react --workspace=@vizzy/mcp --workspace=@vizzy/resolve --workspace=@vizzy/eval --workspace=@vizzy/share --if-present

  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
        working-directory: apps/share
      - run: npx playwright test e2e/home.spec.ts e2e/a11y.spec.ts
        working-directory: apps/share
        env:
          CI: true
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3456

  e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
        working-directory: apps/share
      - run: npm run test:e2e --workspace=@vizzy/share
        env:
          CI: true
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3456
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          COMPOSE_SERVER_SECRET: ${{ secrets.COMPOSE_SERVER_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
